apply plugin: 'com.android.application'

android {
    namespace 'com.ffabhi.app'
    compileSdk 33
    defaultConfig {
        applicationId "com.ffabhi.app"
        minSdk 26
        targetSdk 33
        versionCode 3
        versionName "3.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
